    <script>
      (function() {
        const themes = {
          "warm-editorial": { bg: "#F4EFEA", text: "#232323", accent: "#C84B31", onAccent: "#FFFFFF" },
          "sage-minimalist": { bg: "#F4F6F0", text: "#1C2321", accent: "#7D907C", onAccent: "#000000" },
          "nordic-calm": { bg: "#F0F3F5", text: "#1E252B", accent: "#3A6073", onAccent: "#FFFFFF" },
          "deep-charcoal": { bg: "#1A1A1A", text: "#EAE5DE", accent: "#E07A5F", onAccent: "#000000" },
          "midnight-blue": { bg: "#11161B", text: "#E2E8F0", accent: "#64B5F6", onAccent: "#000000" }
        };
        const stored = localStorage.getItem("duii-theme");
        const theme = themes[stored] || themes["warm-editorial"];
        document.documentElement.style.setProperty("--bg", theme.bg);
        document.documentElement.style.setProperty("--text", theme.text);
        document.documentElement.style.setProperty("--accent", theme.accent);
        document.documentElement.style.setProperty("--on-accent-fallback", theme.onAccent);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
